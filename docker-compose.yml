# One LocalStack container emulating SQS, S3 and DynamoDB (needs Docker): docker compose up -d,
# then python run.py --backend aws. The same boto3 code targets it via AwsConfig.endpoint_url (NOTES.md 6).
services:
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,s3,dynamodb
      - DEFAULT_REGION=us-east-1
    volumes:
      - "localstack-data:/var/lib/localstack"

volumes:
  localstack-data:
